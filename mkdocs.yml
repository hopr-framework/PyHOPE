# General settings
site_name: PyHOPE
site_url: https://hopr-framework.github.io/PyHOPE
repo_url: https://github.com/hopr-framework/PyHOPE
site_description: PyHOPE documentation
site_author: Numerics Research Group (NRG), University of Stuttgart
copyright: Copyright &copy; 2026, <a href="https://numericsresearchgroup.org/team.html">Numerics Research Group</a>
edit_uri: ""  # Disable "Edit on GitHub", just link to the repository

# Build settings
strict: true

# Visual settings
theme:
  name: zensical
  variant: modern
  locale: en
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    # - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    # - navigation.path
    - navigation.prune
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    # - search.highlight
    - toc.follow
    # - toc.integrate
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  logo: assets/pyhope.svg
  favicon: assets/pyhope.svg

# Navigation settings
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Introduction: user-guide/index.md
    - Installation: user-guide/installation.md
    - Library Usage: user-guide/library_usage.md
    - Mesh Generators:
      - Internal: user-guide/mesh-generators/internal.md
      - External: user-guide/mesh-generators/external.md
    - Parameter File Format: user-guide/parameter-file.md
    - Mesh Checks / Visualization: user-guide/visualization.md
  # - Issue Tracker: 'https://github.com/hopr-framework/PyHOPE/issues'
  - Developer Guide:
    - Introduction: developer-guide/index.md
    - GitHub Workflow: developer-guide/github-workflow.md
    - Environment Setup: developer-guide/get-the-source.md
    - Style Guide: developer-guide/style-guide.md
  - Mesh Format: mesh-format.md
  - About:
    - Authors: 'AUTHORS.md'
    - Changelog: 'CHANGELOG.md'
    - Code of Conduct: 'CODE_OF_CONDUCT.md'
    - Contributing: 'CONTRIBUTING.md'
    - License: 'LICENSE.md'

# CSS settings
extra_css:
  - css/extra.css

# extra_javascript:
#   - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
#   - javascripts/tablesort.js

# Footer settings
extra:
  generator: true

# Plugin settings
plugins:
  - search
  # - autorefs
  # Image zoom
  - glightbox

# Markdown settings
markdown_extensions:
  # Content structure
  - toc:
      permalink: true
  - footnotes

  # Images
  - attr_list
  - md_in_html

  # Tabs (content tabs with === "Label" syntax)
  - pymdownx.tabbed:
      alternate_style: true

  # Code
  - pymdownx.highlight:
      anchor_linenums: true
      guess_lang: false
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

  # Math (rendered by MathJax)
  - pymdownx.arithmatex:
      generic: true

  # Callouts, captions and includes
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.snippets

  # Tables
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
