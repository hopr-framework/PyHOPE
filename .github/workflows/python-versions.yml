# ==================================================================================================================================
# Continuous Integration/Continuous Deployment
# ==================================================================================================================================

# Workflow for continuous integration (CI)
name: Python Versions

on:
  # Runs on weekly schedule
  schedule:
    - cron: '0 0 * * 1'
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions
permissions:
  contents: write
  pull-requests: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: update-python-versions
  cancel-in-progress: true

# ----------------------------------------------------------------------------------------------------------------------------------------------------
# Update Python versions
# ----------------------------------------------------------------------------------------------------------------------------------------------------
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Prepare the image
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Run the update script
      - name: Update Python versions
        run: python3 .github/scripts/python_versions.py

      # Create pull request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            .github/workflows/ci.yml
            .gitlab-ci.yml
          commit-message: 'CI/CD: Update Python versions'
          title: 'CI/CD: Update Python versions'
          body: 'Automated update of the Python base images to the latest patch releases.'
          branch: cicd.python.autoupdate
          delete-branch: true
