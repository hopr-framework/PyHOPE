!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName         = 2-17-external_mesh_Gmsh_hybrid_splitToHex ! Name of output files
DebugVisu           = F                              ! Launch the GMSH GUI to visualize the mesh
DebugMesh           = T                              ! Mesh output debug mesh in VTK format
OutputFormat        = HDF5                           ! Mesh output format (HDF5 VTK)

!=============================================================================== !
! MESH
!=============================================================================== !
Mode                = 3                              ! 1 Cartesian 3 External
NGeo                = 1                              ! Polynomial order of the mapping
FileName            = ./2-17-external_mesh_Gmsh_hybrid_splitToHex.msh
doSplitToHex        = T                              ! Split simplex    elements into hexahedral elements
doSplitToHexZ       = F                              ! Split hexahedral elements into h-refined  elements

!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !
BoundaryName        = Boundary                       ! BC index 1 (from position in parameterfile)
BoundaryType        = (/3,0,0,0/)                    ! (/ Type, curveIndex, State, alpha /)
