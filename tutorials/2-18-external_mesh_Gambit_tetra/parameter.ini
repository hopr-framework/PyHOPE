!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName         = 2-18-external_mesh_Gambit_tetra ! Name of output files
DebugVisu           = F                              ! Launch the GMSH GUI to visualize the mesh
DebugMesh           = T                              ! Mesh output debug mesh in VTK format
OutputFormat        = HDF5                           ! Mesh output format (HDF5 VTK)
!=============================================================================== !
! MESH
!=============================================================================== !
Mode                = 3                              ! 1 Cartesian 3 External
NGeo                = 1                              ! Polynomial order of the mapping
FileName            = ./2-18-external_mesh_Gambit_tetra.neu
!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !
BoundaryName=BC_INLET            ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryType=(/3,0,0,0/)             ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryName=BC_OUTLET           ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryType=(/3,0,0,0/)             ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryName=BC_STATOR        ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryType=(/4,0,0,0/)             ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryName=BC_ROTPLUS           ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryType=(/3,0,0,0/)             ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryName=BC_ROTMINUS       ! Outer Surface: ideal conductor [for MAXWELL]
BoundaryType=(/3,0,0,0/)             ! Outer Surface: ideal conductor [for MAXWELL]
