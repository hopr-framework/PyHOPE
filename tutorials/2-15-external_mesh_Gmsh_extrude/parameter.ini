!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName         = 2-15-external_mesh_Gmsh_extrude  ! Name of output files
DebugVisu           = F                              ! Launch the GMSH GUI to visualize the mesh
DebugMesh           = T                              ! Mesh output debug mesh in VTK format
OutputFormat        = HDF5                           ! Mesh output format (HDF5 VTK)

!=============================================================================== !
! MESH
!=============================================================================== !
Mode                = 3                              ! 1 Cartesian 3 External
NGeo                = 2                              ! Polynomial order of the mapping
FileName            = ./2-15-external_mesh_Gmsh_extrude.geo

!=============================================================================== !
! EXTRUSION
!=============================================================================== !
MeshExtrude         = T                              ! Enables mesh extrusion
MeshExtrudeTemplate = linear                         ! Mesh extrusion template
MeshExtrudeLength   = 1.0                            ! Mesh extrusion length
MeshExtrudeElems    = 3                              ! Mesh extrusion number of elements
MeshExtrudeBCIndex  = 6                              ! Mesh extrusion boundary index

!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !
BoundaryName        = BC_Bottom                      ! BC index 1 (from position in parameterfile)
BoundaryType        = (/2,1,0,0/)                    ! (/ Type, curveIndex, State, alpha /)
BoundaryName        = BC_Right                       ! BC index 2
BoundaryType        = (/2,1,0,0/)
BoundaryName        = BC_Left                        ! BC index 3
BoundaryType        = (/2,1,0,0/)
BoundaryName        = BC_Top                         ! BC index 4
BoundaryType        = (/2,1,0,0/)
BoundaryName        = BC_Front                       ! BC index 5
BoundaryType        = (/1,1,0, 1/)
BoundaryName        = BC_Back                        ! BC index 5
BoundaryType        = (/1,1,0,-1/)
vv  = (/0.,0.,1./)
