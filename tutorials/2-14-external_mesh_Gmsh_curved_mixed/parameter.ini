!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName         = NACA0012                       ! Name of output files
DebugVisu           = F                              ! Launch the GMSH GUI to visualize the mesh
DebugMesh           = T                              ! Mesh output debug mesh in VTK format
OutputFormat        = HDF5                           ! Mesh output format (HDF5 VTK)
doMortars           = F

!=============================================================================== !
! MESH
!=============================================================================== !
Mode                = 3                              ! 1 Cartesian 3 External
NGeo                = 2                              ! Polynomial order of the mapping
MeshIsAlreadyCurved = T                              ! Enable curving
FileName            = ./2-14-external_mesh_Gmsh_curved_mixed.msh

CheckWatertightness = T                              ! Check watertighness of the mesh

!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !
BoundaryName        = zplus
BoundaryType        = (/1,0,0,-1/)
BoundaryName        = inlet                          ! BC index 1 (from position in parameterfile)
BoundaryType        = (/2,1,0,0/)                    ! (/ Type, curveIndex, State, alpha /)
BoundaryName        = outlet                         ! BC index 4
BoundaryType        = (/24,0,0,0/)
BoundaryName        = airfoil
BoundaryType        = (/3,1,0,0/)
BoundaryName        = zminus
BoundaryType        = (/1,0,0,1/)
BoundaryName        = meshinterior
BoundaryType        = (/0,0,0,0/)
vv  = (/0.,0.,1./)
