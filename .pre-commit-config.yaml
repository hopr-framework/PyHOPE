# https://pre-commit.com/
# https://github.com/pre-commit/pre-commit
# https://prek.j178.dev
minimum_pre_commit_version: 4.5.1
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.16.10
    hooks:
      # Run the linter
      - id: ruff
        name: ruff       [linter]
        args: [--config=pyproject.toml, --preview]
      # Run the formatter
      # - id: ruff-format
      #   name: ruff formatter
      #   alias: format

  - repo: https://github.com/jendrikseipp/vulture
    # Vulture version
    rev: v2.16
    hooks:
      # Run dead code detection
      # Paths are configured under [tool.vulture] in pyproject.toml
      - id: vulture
        name: vulture    [dead code]

  - repo: https://github.com/astral-sh/ty-pre-commit
    # Ty version
    rev: v0.0.85
    hooks:
      # Run the type checker
      - id: ty
        name: ty         [type checker]
        args: [--color=always, --project=pyhope]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Run secrets detection engine
      - id: gitleaks
        name: gitleaks   [detect hardcoded secrets]

  # Official shellcheck-precommit requires docker
  # - repo: https://github.com/koalaman/shellcheck-precommit
  #   rev: v0.11.0
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      # Run the shell checker
      - id: shellcheck
        name: shellcheck [shell checker]
        # args: ["--severity=warning"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      # Run the shell formatter
      - id: shfmt
        name: shfmt      [shell formatter]
        args: ["-w", "-i=2"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that contain merge conflict strings
      - id: check-merge-conflict
        name: pre-commit [check for merge conflicts]
      - id: check-symlinks
        name: pre-commit [check for broken symlinks]
      - id: trailing-whitespace
        name: pre-commit [trim trailing whitespace]
        exclude: \.(msh|patch)$
        exclude_types: [markdown]
